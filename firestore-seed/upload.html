<!DOCTYPE html>
<html>
<head>
    <title>Upload Cities & Areas to Firestore</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 50px auto; padding: 20px; }
        .status { margin: 10px 0; padding: 10px; border-radius: 5px; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .loading { background: #fff3cd; color: #856404; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>🔥 Upload Cities & Areas to Firestore</h1>
    <div id="status" class="status loading">Ready to upload...</div>
    <button onclick="uploadData()">Upload Data</button>

    <script>
        // Firebase config (from google-services.json)
        const firebaseConfig = {
            apiKey: "AIzaSyDExampleKey123",
            authDomain: "stay-buddy-9d294.firebaseapp.com",
            projectId: "stay-buddy-9d294",
            storageBucket: "stay-buddy-9d294.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:123456789:android:abcdef"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const citiesData = {
            "cities": {
                "Vadodara": { "lat": 22.3072, "lon": 73.1812 },
                "Ahmedabad": { "lat": 23.0225, "lon": 72.5714 },
                "Gandhinagar": { "lat": 23.2156, "lon": 72.6369 },
                "Surat": { "lat": 21.1702, "lon": 72.8311 },
                "Rajkot": { "lat": 22.3039, "lon": 70.8022 },
                "Anand": { "lat": 22.5649, "lon": 72.9553 },
                "Bharuch": { "lat": 21.7051, "lon": 72.9959 },
                "Mehsana": { "lat": 23.5880, "lon": 72.3693 },
                "Kheda": { "lat": 22.7548, "lon": 72.6844 },
                "Godhra": { "lat": 22.7739, "lon": 73.6205 },
                "Himmatnagar": { "lat": 23.5961, "lon": 71.8720 },
                "Bhavnagar": { "lat": 21.7645, "lon": 72.1519 },
                "Jamnagar": { "lat": 22.4707, "lon": 70.0727 },
                "Junagadh": { "lat": 21.5222, "lon": 70.4856 },
                "Nadiad": { "lat": 22.6914, "lon": 72.8603 },
                "Valsad": { "lat": 20.5992, "lon": 72.9342 },
                "Navsari": { "lat": 20.9506, "lon": 72.9301 },
                "Porbandar": { "lat": 21.6420, "lon": 69.6097 },
                "Surendranagar": { "lat": 22.7273, "lon": 71.6483 },
                "Gandhidham": { "lat": 23.0753, "lon": 70.1335 }
            },
            "displayOrder": ["Vadodara", "Ahmedabad", "Gandhinagar", "Surat", "Rajkot", "Anand", "Bharuch", "Mehsana", "Kheda", "Godhra", "Himmatnagar", "Bhavnagar", "Jamnagar", "Junagadh", "Nadiad", "Valsad", "Navsari", "Porbandar", "Surendranagar", "Gandhidham"]
        };

        async function uploadData() {
            const status = document.getElementById('status');
            try {
                status.className = 'status loading';
                status.textContent = 'Uploading cities...';

                await db.collection('location_data').doc('cities').set(citiesData);
                status.textContent = '✅ Cities uploaded! Uploading areas...';

                // Areas will be uploaded separately
                status.textContent = '✅ Cities uploaded successfully! Now upload areas.json via Firebase Console or run again.';
                status.className = 'status success';

            } catch (error) {
                status.textContent = '❌ Error: ' + error.message;
                status.className = 'status error';
            }
        }
    </script>
</body>
</html>
